name: Build Hanabi for Windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hanabi-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Hanabi (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Cache static FFmpeg decoder SDK
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-decode-static
          key: hanabi-ffmpeg-decode-${{ runner.os }}-${{ runner.arch }}-v9.0.2-3

      - name: Cache LLVM libclang
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: hanabi-llvm-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install static FFmpeg decoder libraries and libclang
        shell: pwsh
        run: |
          $version = 'v9.0.2-3'
          $archiveName = 'ffmpeg-decode-static-x86_64-pc-windows-msvc.tar.xz'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-decode-static'
          $header = Join-Path $extract 'include/libavcodec/avcodec.h'
          $library = Join-Path $extract 'lib/avcodec.lib'
          if (-not (Test-Path $header) -or -not (Test-Path $library)) {
            Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
            $url = "https://github.com/martinfrancois/ffmpeg-decode-static/releases/download/$version/$archiveName"
            Invoke-WebRequest -Uri $url -OutFile $archive
            $expectedSha256 = '7821646cb2183f20ef714acaa54575a25d2fe9e50d46bb497e156324d125d766'
            $actualSha256 = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha256 -ne $expectedSha256) { throw "Static FFmpeg archive checksum mismatch: $actualSha256" }
            New-Item -ItemType Directory -Path $extract -Force | Out-Null
            tar.exe -xf $archive -C $extract
          }
          if (-not (Test-Path $header) -or -not (Test-Path $library)) { throw 'Static FFmpeg decoder SDK is incomplete' }
          "FFMPEG_DIR=$($extract -replace '\\','/')" | Add-Content -Path $env:GITHUB_ENV

          $llvmBin = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) { choco install llvm --no-progress --yes }
          if (-not (Test-Path (Join-Path $llvmBin 'libclang.dll'))) {
            $clang = Get-ChildItem -Path $env:ProgramFiles -Filter libclang.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $clang) { throw 'libclang.dll not found; ffmpeg-sys-next requires LLVM/libclang' }
            $llvmBin = $clang.DirectoryName
          }
          "LIBCLANG_PATH=$llvmBin" | Add-Content -Path $env:GITHUB_ENV
          $llvmBin | Add-Content -Path $env:GITHUB_PATH

      - name: Test Hanabi timeline and media engine
        run: cargo test --workspace

      - name: Build Hanabi release
        run: cargo build --release --package hanabi

      - name: Prepare Windows package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist/Hanabi'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item target/release/hanabi.exe $dist -Force

      - name: Cache FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hanabi-ffmpeg-runtime.zip
          key: hanabi-ffmpeg-runtime-${{ runner.os }}-${{ runner.arch }}-gpl-shared-v1

      - name: Bundle FFmpeg tools for media inspection and export
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'hanabi-ffmpeg-runtime.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'hanabi-ffmpeg-runtime'
          if (-not (Test-Path $archive)) {
            $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip'
            Invoke-WebRequest -Uri $url -OutFile $archive
          }
          if (Test-Path $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $bin = Get-ChildItem -LiteralPath $extract -Directory -Filter bin -Recurse | Select-Object -First 1
          if (-not $bin) { throw 'FFmpeg runtime archive did not contain a bin directory' }
          $ffmpegDir = Join-Path $env:GITHUB_WORKSPACE 'dist/Hanabi/ffmpeg'
          New-Item -ItemType Directory -Path $ffmpegDir -Force | Out-Null
          Copy-Item -Path (Join-Path $bin.FullName '*') -Destination $ffmpegDir -Recurse -Force
          Get-ChildItem -LiteralPath $extract -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' } | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $ffmpegDir $_.Name) -Force
          }
          $notice = @'
          FFmpeg CLI tools are bundled from BtbN/FFmpeg-Builds.
          Upstream: https://github.com/FFmpeg/FFmpeg
          Build project: https://github.com/BtbN/FFmpeg-Builds
          The bundled shared Windows build is GPL-licensed; see the accompanying license files.
          The in-process decode library is built from the separate LGPL decode-only FFmpeg SDK.
          '@
          $notice | Set-Content -LiteralPath (Join-Path $ffmpegDir 'THIRD_PARTY_NOTICES.txt') -Encoding UTF8
          Copy-Item LICENSE (Join-Path $env:GITHUB_WORKSPACE 'dist/Hanabi/LICENSE') -Force
          Copy-Item README.md (Join-Path $env:GITHUB_WORKSPACE 'dist/Hanabi/README.md') -Force
          Copy-Item THIRD_PARTY_NOTICES.txt (Join-Path $env:GITHUB_WORKSPACE 'dist/Hanabi/THIRD_PARTY_NOTICES.txt') -Force

      - name: Upload Hanabi Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Hanabi-Windows-x64
          path: dist/Hanabi/*
          if-no-files-found: error
          retention-days: 14
