[package]
name = "hanabi-engine"
version = "0.1.0"
edition = "2021"
description = "Hanabi media, decode, timeline, WGPU preview and export engine"

[lib]
name = "hanabi_engine"
crate-type = ["rlib", "cdylib"]

[dependencies]
hanabi-timeline-core = { path = "../timeline-core" }
serde_json = "1"

# Native GPU preview compositor. FFmpeg remains responsible for codec decode/encode only.
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.15", features = ["derive"] }
# Static, decode-only FFmpeg 9 libraries are provided by the Windows build workflow.
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "filter", "format", "static"] }
